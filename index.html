<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Momento" />
  <meta name="description" content="Diario emocional: anota cómo te sientes en el momento." />
  <title>Momento</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="onboard" class="onboard" hidden></div>
  <div id="lock" class="lock" hidden>
    <div class="lock-card">
      <img src="icons/icon.svg" alt="" width="56" height="56" />
      <h1>Momento</h1>
      <p id="lockMsg">Introduce tu PIN para abrir el diario.</p>
      <form id="lockForm" autocomplete="off">
        <input id="lockPin" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="PIN" autocomplete="off" aria-label="PIN" />
        <button type="submit" class="btn btn-primary btn-block">Abrir</button>
      </form>
      <p id="lockError" class="error" hidden></p>
    </div>
  </div>

  <header class="topbar">
    <button id="backBtn" class="icon-btn" aria-label="Volver" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 id="title">Momento</h1>
    <div id="topActions" class="top-actions"></div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar" aria-label="Secciones">
    <a href="#/" data-tab="home">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 4h9a3 3 0 0 1 3 3v13H8a3 3 0 0 0-3 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M5 4v16M9 8h5M9 12h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Diario</span>
    </a>
    <a href="#/new" data-tab="new" class="tab-new" aria-label="Nueva anotación">
      <span class="tab-new-btn"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></span>
      <span>Ahora</span>
    </a>
    <a href="#/patterns" data-tab="patterns">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 19h16M6 16V9M11 16V5M16 16v-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Patrones</span>
    </a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Ajustes</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
